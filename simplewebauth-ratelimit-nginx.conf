# Nginx rate limit for simplewebauth sign-in POSTs — http {} level.
#
# INSTALL: unlike simplewebauth-nginx.conf (a per-server snippet), this one
# belongs in conf.d/, which the stock nginx.conf includes inside http {}:
#
#   sudo cp simplewebauth-ratelimit-nginx.conf /etc/nginx/conf.d/simplewebauth-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# No per-vhost edits needed: limit_req at the http level is inherited by every
# server and location (unless one sets its own limit_req, which replaces it).
# The map gives a key ONLY to POSTs to login.php / mfa_verify.php; every other
# request gets an empty key, and nginx never limits an empty key — so page
# loads, auth_check.php subrequests and mfa_check.php polling are unaffected.
#
# Per client IP: 10 POSTs in a burst, then one every 6s (10/min). A normal
# sign-in is 1-2 POSTs. Over the limit gets HTTP 429. This complements the
# per-account lockout in PHP (AUTH_LOCKOUT_*), which can't see an attacker
# spraying many usernames from one address.
#
# Behind a reverse proxy, $binary_remote_addr is the proxy — configure
# ngx_http_realip_module (set_real_ip_from / real_ip_header) first, or every
# client shares one bucket.

map "$request_method:$uri" $simplewebauth_signin_key {
    "~^POST:.*/simplewebauth/(login|mfa_verify)\.php$"  $binary_remote_addr;
    default                                             "";
}

limit_req_zone $simplewebauth_signin_key zone=simplewebauth_signin:1m rate=10r/m;
limit_req zone=simplewebauth_signin burst=10 nodelay;
limit_req_status 429;
